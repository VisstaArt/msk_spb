<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rusya Rehberi — Moskova & St. Petersburg</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap');
:root{--bg:#0f1117;--panel:#171a24;--panel2:#1e2230;--line:#2a2f40;--txt:#e8eaf0;--muted:#9aa2b8;--accent:#e23a3a;--accent2:#f5b942;--blue:#3a6ee2;--food:#e07a3f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
header{background:linear-gradient(135deg,#1a1d28,#0f1117);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:1000}
.brand{font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.spacer{flex:1}
.switch{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:30px;padding:3px;gap:2px}
.switch button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:13px;padding:7px 13px;border-radius:30px;cursor:pointer;transition:.2s;white-space:nowrap}
.switch button.active{background:var(--accent);color:#fff}
.switch.lang button.active{background:var(--blue)}
.main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;min-width:0;position:relative;background:#0b0d13}
#map{position:absolute;inset:0}
#schema{position:absolute;inset:0;display:none}
#schema svg{width:100%;height:100%;display:block}
.sch-pin{cursor:pointer}
.sch-pin:hover circle{stroke:#fff;stroke-width:2.5}
.sch-label{position:absolute;background:rgba(15,17,23,.94);border:1px solid var(--line);color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;pointer-events:none;transform:translate(-50%,-160%);white-space:nowrap;display:none;z-index:5}
.sch-note{position:absolute;top:8px;left:8px;right:8px;background:rgba(15,17,23,.85);border:1px solid var(--line);color:var(--muted);font-size:11px;padding:6px 9px;border-radius:8px;line-height:1.4}
.sidebar{width:400px;max-width:45vw;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.sb-head{padding:16px 16px 6px}
.sb-head h2{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.5px}
.sb-head p{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
.legend{display:flex;gap:9px;flex-wrap:wrap;padding:0 16px 10px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.sectitle{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 16px 4px;display:flex;align-items:center;gap:7px}
.sectitle::before,.sectitle::after{content:"";flex:1;height:1px;background:var(--line)}
.list{padding:6px 12px 24px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.18s}
.card:hover{border-color:var(--accent)}.card.open{border-color:var(--accent)}
.card.food:hover,.card.food.open{border-color:var(--food)}
.gal{position:relative;height:200px;background:#0b0d13;overflow:hidden;cursor:pointer}
.gal .track{display:flex;height:100%;transition:transform .35s ease}
.gal .track img{min-width:100%;height:200px;object-fit:cover;object-position:center center;display:block;background:#1a1f2e}
.gal .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,23,0) 45%,rgba(15,17,23,.5) 100%);pointer-events:none}
.gal .tnum{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;z-index:3;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.card.cat-park .tnum{background:#3fae6a}.card.cat-museum .tnum{background:#b15de0}.card.cat-shop .tnum{background:var(--accent2);color:#1a1d28}.card.cat-modern .tnum{background:var(--blue)}.card.cat-food .tnum{background:var(--food)}
.gal .ttl{position:absolute;left:10px;right:10px;bottom:8px;z-index:3}
.gal .ttl .t{font-weight:700;font-size:15px;line-height:1.2;text-shadow:0 1px 4px #000}
.gal .ttl .sub{font-size:11px;color:#cbd0de;margin-top:1px;text-shadow:0 1px 3px #000}
.card-top{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.card-top .meta{flex:1;font-size:11.5px;color:var(--muted);line-height:1.4}
.chev{color:var(--muted);transition:.2s;font-size:13px}.card.open .chev{transform:rotate(180deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .4s ease}.card.open .card-body{max-height:1400px}
.card-inner{padding:0 14px 14px}
.photo-grid{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.photo-grid img{border-radius:8px;cursor:zoom-in;transition:.15s;flex:1 1 120px;max-width:calc(50% - 3px);min-width:80px;height:90px;object-fit:cover;object-position:center center}
.photo-grid img:first-child{flex:1 1 100%;max-width:100%;height:160px}
.photo-grid img:hover{opacity:.85}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:#0f1117;color:var(--muted);border:1px solid var(--line)}
.tag.metro{color:#fff;background:#c4282d;border-color:#c4282d}.tag.time{color:var(--accent2)}.tag.price{color:#1a1d28;background:var(--food);border-color:var(--food)}
.desc{font-size:13.5px;line-height:1.6;color:#cdd2e0;margin-bottom:12px}
.why{background:#0f1117;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.why .wt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent2);margin-bottom:6px}
.why ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.why li{font-size:12.5px;color:#cdd2e0;padding-left:18px;position:relative}.why li::before{content:"✓";position:absolute;left:0;color:#3fae6a;font-weight:700}
.btns{display:flex;gap:8px}
.btns a{flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:12.5px;padding:9px;border-radius:10px;transition:.15s}
.btn-map{background:var(--blue);color:#fff}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:6px}
#lb .lb-prev,#lb .lb-next{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
#lb .lb-prev{left:10px}#lb .lb-next{right:10px}
#lb .lb-close{position:absolute;top:12px;right:14px;color:#fff;font-size:26px;cursor:pointer;width:34px;height:34px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1}
#lb .lb-count{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);font-size:13px;font-family:Manrope,sans-serif}
.leaflet-popup-content-wrapper{background:var(--panel2);color:var(--txt);border-radius:12px;border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel2)}.leaflet-popup-content{margin:0;width:210px!important}
.pop img{width:100%;height:95px;object-fit:cover;border-radius:11px 11px 0 0;display:block;background:#0b0d13}
.pop .pin-in{padding:8px 11px}.pop .pt{font-weight:700;font-size:13px;margin-bottom:2px}.pop .ps{font-size:11px;color:var(--muted);margin-bottom:7px}
.pop a{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--accent);padding:5px 10px;border-radius:7px;text-decoration:none}
@media(max-width:780px){.main{flex-direction:column}#mapwrap{height:0;flex:none;overflow:hidden;transition:height .35s ease}#mapwrap.map-open{height:55vh}.sidebar{width:100%;max-width:100%;border-left:none;border-top:1px solid var(--line);flex:1}.brand{font-size:14px}.switch button{padding:6px 10px;font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span><span id="brandText">Rusya Rehberi</span></div>
    <div class="spacer"></div>
    <div class="switch city">
      <button id="cMoscow" class="active" onclick="setCity('moscow')">Moskova</button>
      <button id="cSpb" onclick="setCity('spb')">St. Petersburg</button>
    </div>
    <div class="switch lang">
      <button id="lTr" class="active" onclick="setLang('tr')">TR</button>
      <button id="lRu" onclick="setLang('ru')">RU</button>
    </div>
  </header>
  <div class="main">
    <div id="mapwrap">
      <div id="map"></div>
      <div id="schema"><div class="sch-note" id="schNote"></div><div class="sch-label" id="schLabel"></div></div>
    </div>
    <div class="sidebar">
      <div class="sb-head"><h2 id="cityName">Moskova</h2><p id="cityDesc"></p></div>
      <div class="legend" id="legend"></div>
      <div id="listSights"></div>
      <div class="sectitle" id="foodTitle"></div>
      <div id="listFood"></div>
    </div>
  </div>
</div>
<div id="lb"><span class="lb-close" onclick="lbClose()">&#x2715;</span><span class="lb-prev" onclick="lbMove(-1)">&#8249;</span><img id="lbImg" src=""><span class="lb-next" onclick="lbMove(1)">&#8250;</span><span class="lb-count" id="lbCount"></span></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
